[package]
name = "controller-parity"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Spreadsheet-authored semantic controller input parity core"

[lib]
name = "controller_parity"
path = "src/lib.rs"

[[bin]]
name = "controller-parity"
path = "src/main.rs"

[features]
default = []
bevy = ["dep:bevy_app", "dep:bevy_ecs", "dep:bevy_input"]

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_app = { version = "0.19", optional = true }
bevy_ecs = { version = "0.19", optional = true }
bevy_input = { version = "0.19", features = ["gamepad", "std"], optional = true }
